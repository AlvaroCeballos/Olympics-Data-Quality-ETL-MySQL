services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Create Fase2/.env from .env.example}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./ddl/olimpiada2s.sql:/docker-entrypoint-initdb.d/01-olimpiadas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  xtrabackup:
    image: percona/percona-xtrabackup:8.0
    profiles: ["tools"]
    user: "0:0"
    entrypoint: ["/bin/sh", "/usr/local/bin/xtrabackup-entrypoint.sh"]
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backup/archivos:/backups
      - ./backup/xtrabackup.cnf:/run/config/xtrabackup.cnf:ro
      - ./backup/backup-encryption.key:/run/config/backup-encryption.key:ro
      - ./backup/scripts/xtrabackup-entrypoint.sh:/usr/local/bin/xtrabackup-entrypoint.sh:ro

volumes:
  mysql_data:
    name: fase2_olimpiadas_mysql_data
